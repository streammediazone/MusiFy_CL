name: musify
description: MusiFy Android music player.
publish_to: "none"
version: 0.2.1+3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  just_audio: ^0.9.46
  just_audio_background: ^0.0.1-beta.17
  audio_service: ^0.18.19
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/musify_logo.jpg
